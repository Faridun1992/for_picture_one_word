stages:
  - test
  - build
  - deploy

# ─── TEST ────────────────────────────────────────────────────────────────────
test:
  stage: test
  image: php:8.4.20-fpm

  services:
    - name: mysql:8.4.8
      alias: mysql

  variables:
    # MySQL сервис
    MYSQL_ROOT_PASSWORD: "ci_secret"
    MYSQL_DATABASE: "testing"
    # Laravel .env переменные для CI
    APP_ENV: "testing"
    DB_CONNECTION: "mysql"
    DB_HOST: "mysql"
    DB_PORT: "3306"
    DB_DATABASE: "testing"
    DB_USERNAME: "root"
    DB_PASSWORD: "ci_secret"
    CACHE_STORE: "array"
    QUEUE_CONNECTION: "sync"
    SESSION_DRIVER: "array"
    SCOUT_DRIVER: "null"
    SCOUT_QUEUE: "false"
    FILESYSTEM_DISK: "local"
    # Заглушки для сервисов, которые не нужны в тестах
    CLICKHOUSE_HOST: "localhost:8123"
    MANTICORE_MYSQL_HOST: "localhost"
    MANTICORE_MYSQL_PORT: "9306"
    REDIS_HOST: "localhost"
    REDIS_PASSWORD: ""

  before_script:
    # Устанавливаем системные зависимости
    - apt-get update -qq
    - apt-get install -y --no-install-recommends ca-certificates curl openssl unzip git libpng-dev libzip-dev libfreetype6-dev libjpeg62-turbo-dev libwebp-dev pkg-config
    - update-ca-certificates
    - rm -rf /var/lib/apt/lists/*
    - docker-php-ext-install pdo pdo_mysql zip exif pcntl
    - docker-php-ext-configure gd --with-freetype --with-jpeg --with-webp && docker-php-ext-install -j$(nproc) gd
    - pecl install redis && docker-php-ext-enable redis
    - echo "memory_limit=-1" > /usr/local/etc/php/conf.d/memory.ini
    # Composer
    - curl -fsSL https://getcomposer.org/download/latest-stable/composer.phar -o /usr/local/bin/composer
    - chmod +x /usr/local/bin/composer
    - composer --version
    # .env для CI
    - cp .env.example .env
    - sed -i "s|APP_ENV=.*|APP_ENV=testing|" .env
    - sed -i "s|DB_HOST=.*|DB_HOST=mysql|" .env
    - sed -i "s|DB_DATABASE=.*|DB_DATABASE=testing|" .env
    - sed -i "s|DB_USERNAME=.*|DB_USERNAME=root|" .env
    - sed -i "s|DB_PASSWORD=.*|DB_PASSWORD=ci_secret|" .env
    - sed -i "s|CACHE_STORE=.*|CACHE_STORE=array|" .env
    - sed -i "s|QUEUE_CONNECTION=.*|QUEUE_CONNECTION=sync|" .env
    - sed -i "s|SESSION_DRIVER=.*|SESSION_DRIVER=array|" .env
    - sed -i "s|SCOUT_QUEUE=.*|SCOUT_QUEUE=false|" .env
    - sed -i "s|FILESYSTEM_DISK=.*|FILESYSTEM_DISK=local|" .env
    - composer install --no-interaction --prefer-dist --no-progress
    - php artisan key:generate
    - php artisan config:clear
    - php artisan migrate --force

  script:
    - php artisan test

  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

  cache:
    key: "$CI_COMMIT_REF_SLUG-composer"
    paths:
      - vendor/
      - node_modules/
    policy: pull-push


# ─── BUILD FRONTEND ──────────────────────────────────────────────────────────
build_frontend:
  stage: build
  image: node:22-alpine

  script:
    - npm ci
    - npm run build

  artifacts:
    paths:
      - public/build/
    expire_in: 1 hour

  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"

  cache:
    key: "$CI_COMMIT_REF_SLUG-node"
    paths:
      - node_modules/
    policy: pull-push


# ─── DEPLOY STAGING ──────────────────────────────────────────────────────────
deploy_staging:
  stage: deploy
  image: alpine:latest

  environment:
    name: staging
    url: https://projectclub-dev.ru

  before_script:
    - apk add --no-cache openssh-client bash rsync
    - eval $(ssh-agent -s)
    - chmod 400 "$SSH_PRIVATE_KEY" && ssh-add "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts

  script:
    - rsync -az --delete public/build/ $SSH_USER@$SSH_HOST:$DEPLOY_PATH/public/build/
    - ssh $SSH_USER@$SSH_HOST "DEPLOY_PATH=$DEPLOY_PATH DEPLOY_BRANCH=$CI_COMMIT_BRANCH bash $DEPLOY_PATH/scripts/deploy.sh"

  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      when: on_success

  needs:
    - test
    - build_frontend


# ─── DEPLOY PRODUCTION ───────────────────────────────────────────────────────
deploy_production:
  stage: deploy
  image: alpine:latest

  environment:
    name: production
    url: https://imho.club

  before_script:
    - apk add --no-cache openssh-client bash rsync
    - eval $(ssh-agent -s)
    - echo "$PROD_SSH_PRIVATE_KEY_B64" | base64 -d > /tmp/prod_ssh_key
    - chmod 400 /tmp/prod_ssh_key
    - ssh-add /tmp/prod_ssh_key
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts

  script:
    - rsync -az --delete public/build/ $PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/public/build/
    - ssh $PROD_SSH_USER@$PROD_SSH_HOST "DEPLOY_PATH=$PROD_DEPLOY_PATH make -C $PROD_DEPLOY_PATH deploy-prod"

  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

  needs:
    - test
    - build_frontend
