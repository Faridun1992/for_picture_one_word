services:
    nginx:
        container_name: nginx
        environment:
          TZ: ASIA/Dushanbe
        build:
          context: ./
          dockerfile: ./docker/nginx/prod/Dockerfile
        volumes:
          - ./docker/nginx/prod/conf.d:/etc/nginx/conf.d:ro
          - ./docker/nginx/prod/nginx.conf:/etc/nginx/nginx.conf:ro
          - /etc/ssl/imho.club:/etc/ssl/imho.club:ro
          - storage-data:/var/www/storage
        ports:
          - "80:80"
          - "443:443"
        depends_on:
          php:
            condition: service_healthy
        restart: always
        networks:
          - app-network
        cpus: 0.5
        mem_limit: 128m
        memswap_limit: 192m
        healthcheck:
          test: ["CMD-SHELL", "curl -sf http://127.0.0.1/healthz || exit 1"]
          interval: 30s
          timeout: 5s
          retries: 3
          start_period: 15s
        logging:
          driver: json-file
          options:
            max-size: "20m"
            max-file: "5"

    php:
        container_name: php
        environment:
          TZ: Asia/Dushanbe
        build:
          args:
            user: ${PROJECT_USER}
            uid: ${UID}
            gid: ${GID}
          context: ./
          dockerfile: ./docker/php-fpm/Dockerfile-prod
        volumes:
          - ./.env:/var/www/.env:ro
          - storage-data:/var/www/storage
          - bootstrap-cache:/var/www/bootstrap/cache
        depends_on:
          mysql:
            condition: service_healthy
          redis:
            condition: service_healthy
        restart: always
        networks:
          - app-network
          - data-network
        cpus: 1.5
        mem_limit: 1280m
        memswap_limit: 1536m
        healthcheck:
          test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 2>/dev/null | grep -q pong"]
          interval: 30s
          timeout: 5s
          retries: 3
          start_period: 30s
        logging:
          driver: json-file
          options:
            max-size: "20m"
            max-file: "5"

    mysql:
        container_name: mysql
        image: mysql:8.4.8
        restart: always
        volumes:
          - database:/var/lib/mysql
          - ./docker/mysql/create-database.sql:/docker-entrypoint-initdb.d/create-database.sql:ro
          - ./docker/mysql/prod:/etc/mysql/conf.d:ro
        environment:
          - TZ=Asia/Dushanbe
          - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
          - MYSQL_USER=${DB_USERNAME}
          - MYSQL_PASSWORD=${DB_PASSWORD}
          - MYSQL_DATABASE=${DB_DATABASE}
        healthcheck:
          test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h localhost -u root --silent"]
          interval: 15s
          timeout: 10s
          retries: 10
          start_period: 60s
        networks:
          - data-network
        cpus: 1.0
        mem_limit: 1792m
        memswap_limit: 2048m
        logging:
          driver: json-file
          options:
            max-size: "20m"
            max-file: "5"

    redis:
        container_name: redis
        image: redis:7.4.2
        volumes:
          - redis:/data
        command: [
            "redis-server",
            "--requirepass", "${REDIS_PASSWORD}",
            "--maxmemory", "512mb",
            "--maxmemory-policy", "allkeys-lru",
            "--appendonly", "yes",
            "--appendfsync", "everysec",
            "--no-appendfsync-on-rewrite", "yes",
            "--tcp-backlog", "511",
            "--timeout", "0",
            "--tcp-keepalive", "60",
            "--hz", "10"
        ]
        environment:
          - TZ=Asia/Dushanbe
          - REDIS_PASSWORD=${REDIS_PASSWORD}
        restart: always
        networks:
          - data-network
        cpus: 0.25
        mem_limit: 384m
        memswap_limit: 512m
        healthcheck:
          test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
          interval: 15s
          timeout: 5s
          retries: 5
          start_period: 10s
        logging:
          driver: json-file
          options:
            max-size: "20m"
            max-file: "5"

    supervisor:
        container_name: supervisor
        environment:
          TZ: Asia/Dushanbe
          PROJECT_USER: ${PROJECT_USER}
        build:
          args:
            user: ${PROJECT_USER}
            uid: ${UID}
            gid: ${GID}
          context: ./
          dockerfile: ./docker/supervisor/Dockerfile
        volumes:
          - ./.env:/var/www/.env:ro
          - ./docker/supervisor/conf.d:/etc/supervisor/conf.d:ro
          - storage-data:/var/www/storage
          - bootstrap-cache:/var/www/bootstrap/cache
        restart: always
        networks:
          - app-network
          - data-network
        depends_on:
          mysql:
            condition: service_healthy
          redis:
            condition: service_healthy
        cpus: 1.5
        mem_limit: 1536m
        memswap_limit: 1792m
        healthcheck:
          test: ["CMD-SHELL", "supervisorctl status laravel-horizon | grep -q RUNNING"]
          interval: 30s
          timeout: 10s
          retries: 5
          start_period: 60s
        logging:
          driver: json-file
          options:
            max-size: "20m"
            max-file: "5"

volumes:
    database:
    redis:
    storage-data:
    bootstrap-cache:
networks:
    app-network:
    data-network:
