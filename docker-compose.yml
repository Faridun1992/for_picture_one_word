services:
    nginx:
        container_name: nginx_game
        build:
            context: ./docker/nginx/local
            dockerfile: Dockerfile
        volumes:
            - ./:/var/www
            - ./docker/nginx/local/conf.d:/etc/nginx/conf.d
            - ./docker/nginx/stage/nginx.conf:/etc/nginx/nginx.conf
        ports:
            - "80:80"
            - "443:443"
        depends_on:
            - php
            - node
        healthcheck:
            test: ["CMD-SHELL", "service nginx status || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        restart: unless-stopped
        networks:
            - app-network

    php:
        container_name: php_game
        environment:
            TZ: ASIA/Dushanbe
        build:
            args:
                user: ${PROJECT_USER}
                uid: ${UID}
                gid: ${GID}
            context: ./docker/php-fpm
            dockerfile: Dockerfile
        volumes:
            - ./:/var/www
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started
        healthcheck:
            test: ["CMD-SHELL", "php-fpm -t || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 20s
        restart: unless-stopped
        networks:
            - app-network

    mysql:
        container_name: mysql_game
        image: mysql:8.4.8
        volumes:
            - database:/var/lib/mysql
            - ./docker/mysql/create-database.sql:/docker-entrypoint-initdb.d/create-database.sql
            - ./docker/mysql/stage:/etc/mysql/conf.d
        environment:
            - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
            - MYSQL_USER=${DB_USERNAME}
            - MYSQL_PASSWORD=${DB_PASSWORD}
            - MYSQL_DATABASE=${DB_DATABASE}
        ports:
            - ${DB_PORT}:${DB_PORT}
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        restart: unless-stopped
        networks:
            - app-network

    node:
        container_name: node_game
        image: node:22-alpine
        ports:
            - "3000:3000"
        volumes:
            - ./:/var/www
        working_dir: /var/www
        tty: true
        restart: unless-stopped
        networks:
            - app-network

    redis:
        container_name: redis_game
        image: redis:7.4.2
        volumes:
            - redis:/data
        ports:
            - ${REDIS_PORT}:${REDIS_PORT}
        command: [
            "redis-server",
            "--requirepass", "${REDIS_PASSWORD}",
            "--maxmemory", "256mb",
            "--maxmemory-policy", "allkeys-lru",
            "--appendonly", "yes"
        ]
        environment:
            - REDIS_PASSWORD=${REDIS_PASSWORD}
        healthcheck:
            test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: unless-stopped
        networks:
            - app-network

volumes:
    database:
    redis:
networks:
    app-network:
