server {
    listen 80;
    index index.php;
    root /var/www/public;
    client_max_body_size 50M;

    add_header Strict-Transport-Security "max-age=31536000";
    add_header Content-Security-Policy "block-all-mixed-content";

    # Gzip для HTML/JSON/CSS/JS ответов
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml text/javascript image/svg+xml;

    # Буферизация ответов FastCGI — снижает время ожидания клиента
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location /docs {
        try_files $uri $uri/;
    }

    # Private disk files must reach Laravel's signed-URL handler, not the static-asset 404 rule.
    location ^~ /storage/ {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known|docker).* {
        deny all;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        try_files $uri =404;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
