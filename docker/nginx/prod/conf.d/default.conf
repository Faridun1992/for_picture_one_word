server {
    listen 80;
    listen [::]:80;

    server_name imho.club *.imho.club;

    # Healthcheck endpoint (nginx отвечает сам, без PHP)
    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name imho.club *.imho.club;

    ssl_certificate /etc/ssl/imho.club/imho.club.crt;
    ssl_certificate_key /etc/ssl/imho.club/imho.club.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    index index.php;
    root /var/www/public;
    client_max_body_size 50M;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self' https: data:; connect-src 'self' https:; frame-src 'self' https://www.youtube.com https://youtube.com https://rutube.ru https://vk.com https://vkvideo.ru https://video.vk.com https://runtime.video.cloud.yandex.net; child-src 'self' https://www.youtube.com https://youtube.com https://rutube.ru https://vk.com https://vkvideo.ru https://video.vk.com https://runtime.video.cloud.yandex.net; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https:; block-all-mixed-content" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Connection limit per IP
    limit_conn perip 100;

    # Healthcheck endpoint (на 443 тоже)
    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location /docs {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Rate limiting auth endpoints (10 req/min, burst 5)
    location ~ ^/(login|register|forgot-password|reset-password) {
        limit_req zone=auth burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Deny access to hidden files (except well-known)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Static assets — long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Block common exploit paths
    location ~* /(wp-admin|wp-login|wp-content|xmlrpc|\.env|\.git|vendor/) {
        deny all;
        return 404;
    }
}
