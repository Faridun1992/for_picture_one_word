server {
    listen 80;
    listen [::]:80;

    server_name projectclub-dev.ru *.projectclub-dev.ru;

    # Docker healthcheck (по HTTP, без basic_auth и без редиректа)
    location = /healthz {
        access_log off;
        auth_basic off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name projectclub-dev.ru *.projectclub-dev.ru;
    ssl_certificate /etc/ssl/projectclub-dev.ru/projectclub-dev.ru.crt;
    ssl_certificate_key /etc/ssl/projectclub-dev.ru/projectclub-dev.ru.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    index index.php;
    root /var/www/public;
    client_max_body_size 50M;

    auth_basic "Restricted Area";
    auth_basic_user_file /etc/nginx/conf.d/.htpasswd;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "block-all-mixed-content";
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location /docs {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Rate limiting для auth-эндпоинтов (брутфорс защита: 10 req/min с burst 5)
    location ~ ^/(login|register|forgot-password|reset-password) {
        limit_req zone=auth burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ ^/(fpm-status|ping)$ {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
        auth_basic off;
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
    }

    location ~ /\.(?!well-known|docker).* {
        deny all;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        try_files $uri =404;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
