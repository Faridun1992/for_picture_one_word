[www]
; Менеджер процессов: dynamic — запускает процессы по мере нагрузки
pm = dynamic

; Сервер: 4 CPU / 8 GB RAM. PHP-FPM контейнер имеет лимит 1280 MB.
; 8 воркеров × ~100 MB = ~800 MB + opcache shared 256 MB + FPM master ≈ 1100 MB,
; остаётся запас ~180 MB под всплески памяти на запрос.
pm.max_children = 8

; Количество воркеров при старте
pm.start_servers = 3

; Минимум простаивающих воркеров (резерв под всплески)
pm.min_spare_servers = 2

; Максимум простаивающих воркеров
pm.max_spare_servers = 5

; Перезапускать воркер после N запросов — защита от утечек памяти в long-running процессах
pm.max_requests = 500

; Страница статуса FPM (для мониторинга) и ping (для healthcheck)
pm.status_path = /fpm-status
ping.path = /ping
ping.response = pong

; Логировать медленные запросы (> 3 сек) — помогает найти тяжёлые операции
slowlog = /proc/self/fd/2
request_slowlog_timeout = 3s

; Убивать воркер если запрос висит дольше 300 сек (защита от зависших процессов)
request_terminate_timeout = 300s
