[www]
; Менеджер процессов: dynamic — запускает процессы по мере нагрузки
pm = dynamic

; Сервер: 8 CPU / 16 GB RAM. PHP-FPM контейнер имеет лимит 2560 MB.
; 20 воркера x ~100 MB = ~2000 MB — остаётся запас на FPM master + opcache shared.
pm.max_children = 20

; Количество воркеров при старте
pm.start_servers = 8

; Минимум простаивающих воркеров (резерв под всплески)
pm.min_spare_servers = 4

; Максимум простаивающих воркеров
pm.max_spare_servers = 12

; Перезапускать воркер после N запросов — защита от утечек памяти
pm.max_requests = 1000

; Страница статуса FPM (для мониторинга и healthcheck)
pm.status_path = /fpm-status
ping.path = /ping
ping.response = pong

; Логировать медленные запросы (> 3 сек)
slowlog = /proc/self/fd/2
request_slowlog_timeout = 3s

; Убивать воркер если запрос висит дольше 300 сек
request_terminate_timeout = 300s
